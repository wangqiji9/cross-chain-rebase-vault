[profile.default]
src = "src"
out = "out"
libs = ["lib"]
rpc_endpoints= { sepolia-eth = "https://eth-sepolia.g.alchemy.com/v2/SyjQUSOQIlxPbPlNQdgFR", arb-sepolia = "https://arb-sepolia.g.alchemy.com/v2/Hcg0KpzHJN2Xe4HQliUJf"}

remappings = [
    '@openzeppelin/=lib/openzeppelin-contracts/',
    '@ccip/=lib/ccip/'
]

optimizer = true
optimizer_runs = 200 


